name: Render lecture notes preview
on:
  push:
    branches: [render-preview-fig12]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare preview figures
        shell: bash
        run: |
          python -m pip install --quiet pillow
          mkdir -p lecture_notes/images
          cat > /tmp/fig11.b64 <<'B64'

B64
          base64 -d /tmp/fig11.b64 > lecture_notes/images/week01_storyreasoning_task.jpg
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math, os
          W,H=1800,940
          bg='#fbfaf8'; ink='#222124'; muted='#6b6870'; accent='#7a214f'; soft='#e6e0e3'; line='#3a363a'
          im=Image.new('RGB',(W,H),bg); d=ImageDraw.Draw(im)
          def F(n,b=False):
              p='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if b else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
              return ImageFont.truetype(p,n)
          def ct(box,txt,font,fill=ink):
              x0,y0,x1,y1=box; bb=d.multiline_textbbox((0,0),txt,font=font,align='center',spacing=4)
              d.multiline_text(((x0+x1-(bb[2]-bb[0]))/2,(y0+y1-(bb[3]-bb[1]))/2),txt,font=font,fill=fill,align='center',spacing=4)
          def box(b,txt,font=None,fill='#f4f1f2',outline=soft,tfill=ink):
              d.rounded_rectangle(b,radius=22,fill=fill,outline=outline,width=2); ct(b,txt,font or F(28),tfill)
          def arr(a,b):
              d.line([a,b],fill=line,width=4); ang=math.atan2(b[1]-a[1],b[0]-a[0])
              for da in (2.55,-2.55):
                  d.line([b,(b[0]+15*math.cos(ang+da),b[1]+15*math.sin(ang+da))],fill=line,width=4)
          # Input stacks (abstract for build preview)
          d.text((65,72),'frames ×4',font=F(22),fill=muted)
          for k in range(4):
              y=120+k*48; d.rounded_rectangle([55,y,245,y+82],radius=10,fill='#d9d4d7',outline=soft,width=2)
          d.text((65,472),'descriptions ×4',font=F(22),fill=muted)
          for k in range(4):
              y=515+k*42; d.rounded_rectangle([55,y,245,y+30],radius=8,fill='white',outline=soft,width=2)
              d.line([73,y+10,190,y+10],fill=muted,width=3); d.line([73,y+20,160,y+20],fill='#aaa5a9',width=3)
          box([315,155,505,300],'Frame\nencoder',F(30,True)); box([315,535,505,680],'Text\nencoder',F(30,True))
          arr((245,225),(315,225)); arr((245,595),(315,595))
          box([610,325,800,510],'Fusion',F(34,True),fill='#f2e4eb',outline='#d9b8c9',tfill=accent)
          arr((505,225),(610,380)); arr((505,605),(610,455))
          d.text((570,545),'each time step',font=F(20),fill=muted)
          box([885,300,1105,535],'Sequence\nmodel',F(34,True),fill='#efecee',outline='#d9d3d6'); arr((800,418),(885,418))
          split=(1170,418); arr((1105,418),split); d.ellipse([1162,410,1178,426],fill=accent)
          # Image
          d.line([1170,418,1170,165],fill=line,width=4); arr((1170,165),(1280,165))
          box([1280,105,1450,225],'Stochastic\nlatent',F(28),fill='#fbf3f6',outline='#e3cbd7'); arr((1450,165),(1530,165))
          box([1530,105,1705,225],'Image\ndecoder',F(28)); d.text((1550,65),'image',font=F(22),fill=muted)
          # Text
          arr((1170,418),(1235,418)); box([1235,360,1380,476],'Text\nembedding',F(22),fill='#faf7f8')
          arr((1380,418),(1420,418)); box([1420,345,1585,490],'Memory +\ncross-attention',F(22),fill='#f7f3f5')
          arr((1585,418),(1615,418)); box([1615,345,1760,490],'Language\ndecoder',F(22)); d.text((1630,305),'text',font=F(22),fill=muted)
          # Characters
          d.line([1170,418,1170,700],fill=line,width=4); arr((1170,700),(1400,700))
          box([1400,635,1625,765],'Character\nprediction',F(28)); d.text((1422,595),'characters',font=F(22),fill=muted)
          im.save('lecture_notes/images/architecture_overview.png',optimize=True)
          PY
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended biber
      - name: Compile lecture notes
        working-directory: lecture_notes
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Name rendered PDF
        run: cp lecture_notes/main.pdf dnnls_lecture_notes_v0.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: dnnls-lecture-notes-preview
          path: dnnls_lecture_notes_v0.pdf
          if-no-files-found: error
